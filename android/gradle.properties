# -Dfile.encoding=UTF-8：强制 Gradle/JVM 以 UTF-8 处理含中文的路径与文件，
# 避免 Windows GBK 默认编码导致中文路径读取乱码（配合 release 构建从 ASCII 联接路径 D:\mt 进行）。
org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
android.useAndroidX=true
# This newDsl flag was added by the Flutter template.
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# 项目路径含中文（微旅途），AGP 默认拒绝非 ASCII 路径，此处显式放行（官方选项，见 b.android.com/95744）
android.overridePathCheck=true
# Pub 缓存位于 C 盘而项目位于 D 盘，跨驱动器路径导致 Kotlin 增量编译缓存报
# "different roots" 异常（share_plus/image_picker_android 编译失败），禁用增量编译绕开
kotlin.incremental=false
